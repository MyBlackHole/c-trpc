name: RPC 端点固定源码快照
on:
  push:
    branches: [diag/rpc-endpoint-source-20261016]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 52c55de06c3abb29800aca41f4b10801949eea19
          persist-credentials: false
      - name: 归档固定源码和 Git 对象身份
        run: |
          set -euo pipefail
          mkdir snapshot
          git rev-parse HEAD > snapshot/commit.txt
          git archive --format=tar.gz HEAD > snapshot/source.tar.gz
          git ls-tree -r HEAD > snapshot/tree.txt
          git cat-file -p HEAD > snapshot/commit-object.txt
          cd snapshot
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rpc-endpoint-source-52c55de0
          path: snapshot/
          retention-days: 3
