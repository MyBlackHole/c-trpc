name: Message recovery source snapshot
on:
  push:
    branches: ["diag/message-recovery-source-20261015"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 13883aeed58d3d9f76b5ac4969e64b5bf34e7fda
          persist-credentials: false
      - name: 仅归档固定提交的受版本控制源码
        run: |
          mkdir -p "$RUNNER_TEMP/source-snapshot"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/source-snapshot/c-trpc.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source-snapshot/commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source-snapshot/tree.txt"
          cd "$RUNNER_TEMP/source-snapshot"
          sha256sum c-trpc.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: message-recovery-source-13883aee
          path: ${{ runner.temp }}/source-snapshot/
          retention-days: 3
          if-no-files-found: error
