name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.cc }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          make clean
          make test CC=${{ matrix.cc }}

  asan-ubsan:
    name: ASan + UBSan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make clean
          make test \
            CC=gcc \
            CFLAGS="-O1 -g -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude -pthread -fsanitize=address,undefined -fno-omit-frame-pointer" \
            LDFLAGS="-pthread -fsanitize=address,undefined"

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          make clean
          make test \
            CC=gcc \
            CFLAGS="-O1 -g -std=c99 -Wall -Wextra -Werror -pedantic -Iinclude -pthread -fsanitize=thread -fno-omit-frame-pointer" \
            LDFLAGS="-pthread -fsanitize=thread"
