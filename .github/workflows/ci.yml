name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "refactor/**"
  pull_request:

permissions:
  contents: read

env:
  XMAKE_VERSION: '3.1.1'

jobs:
  build-test-gcc:
    name: build-test (gcc)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 设置构建与测试临时目录
        run: |
          printf 'TMPDIR=%s\nXMAKE_TMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: 准备私有中文消息 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales libssl-dev
          mkdir -p "$RUNNER_TEMP/echo-locale"
          localedef --no-archive -i zh_CN -f UTF-8 "$RUNNER_TEMP/echo-locale/zh_CN.UTF-8"
          echo "LOCPATH=$RUNNER_TEMP/echo-locale" >> "$GITHUB_ENV"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 校验 Echo 翻译目录
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          python3 scripts/compile_echo_catalog.py --check
      - name: 构建全部目标并测试 debug 与 release 模式
        run: |
          for mode in debug release; do
            xmake f -c -y -m "$mode" --toolchain=gcc --crc32c_portable=n
            python3 scripts/check_compile_commands.py --output-dir "build/compdb/gcc-$mode" --mode "$mode" --toolchain gcc --crc32c-portable n --arch x86_64
            xmake build --all -v
            xmake test -v -j1
          done
      - name: 运行 RPC V2 小状态模型与组件回放自测
        run: |
          mkdir -p build/test-tmp
          export TMPDIR="$GITHUB_WORKSPACE/build/test-tmp"
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/test_rpc_v2_model.py -v
          python3 scripts/test_rpc_v2_component_replay.py -v
          python3 scripts/test_rpc_v2_trace_explorer.py -v
          python3 scripts/rpc_v2_trace_explorer.py \
            --seed 33047 --cases 64 --max-events 48 \
            --failure-dir build/test-tmp/rpc-v2-trace-explorer
          python3 scripts/rpc_v2_component_replay.py \
            --binary build/linux/x86_64/release/test_rpc_record_endpoint_contract
          python3 scripts/rpc_v2_component_replay.py \
            --trace tests/fixtures/rpc_v2_model/component-deadline-late-work-v1.json \
            --binary build/linux/x86_64/release/test_rpc_record_endpoint_contract
          python3 scripts/rpc_v2_component_replay.py \
            --trace tests/fixtures/rpc_v2_model/component-stale-message-after-reuse-v1.json \
            --binary build/linux/x86_64/release/test_rpc_record_endpoint_contract
          python3 scripts/rpc_v2_component_replay.py \
            --trace tests/fixtures/rpc_v2_model/component-final-reset-after-accepted-v1.json \
            --binary build/linux/x86_64/release/test_rpc_record_endpoint_contract
      - name: 保留 RPC V2 TEST-C1 失败轨迹
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-v2-test-c1-failure-replay
          path: build/test-tmp/rpc-v2-trace-explorer/
          if-no-files-found: ignore
          retention-days: 7
      - name: 核验 RPC V1 退役引用与生产对象链接证据
        run: |
          set -euo pipefail
          python3 scripts/test_rpc_v1_inventory.py
          python3 scripts/rpc_v1_inventory.py \
            --archive build/linux/x86_64/release/libtrcore.a \
            --output build/audit/rpc-v1-retirement.json \
            --deny-v1-core \
            --deny tr_rpc_endpoint_flush \
                   tr_rpc_endpoint_flush_on_owner \
                   tr_rpc_endpoint_finalize_detached_with_stats \
                   tr_client_legacy_create \
                   tr_client_legacy_register_method \
                   tr_client_legacy_unary_call \
                   tr_client_legacy_unary_call_ex \
                   tr_client_legacy_call_start \
                   tr_client_legacy_call_start_ex \
                   tr_client_create_with_tuning \
                   tr_client_get_rpc_stats \
                   tr_server_create_with_tuning \
                   tr_server_legacy_create \
                   tr_server_legacy_register_method \
                   tr_server_legacy_register_stream_method \
                   tr_runtime_shard_rpc_executor \
                   tr_runtime_rpc_executor_config \
                   tr_runtime_legacy_rpc_execution_create \
                   tr_runtime_legacy_rpc_execution_can_start \
                   tr_runtime_legacy_rpc_execution_start \
                   tr_runtime_legacy_rpc_execution_stop \
                   tr_runtime_legacy_rpc_execution_destroy \
                   tr_runtime_legacy_rpc_execution_group \
                   tr_runtime_legacy_rpc_execution_raw
      - name: 保留 V1 引用与静态库对象清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-v1-retirement-inventory
          path: build/audit/rpc-v1-retirement.json
          if-no-files-found: ignore
          retention-days: 7
      - name: 验证真实编译数据库的正负例
        run: python3 scripts/test_compile_commands.py -v
      - name: 保留 GCC 编译数据库与配置身份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-database-gcc
          path: build/compdb/
          if-no-files-found: ignore
          retention-days: 7

  build-test-clang:
    name: build-test (clang)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 设置构建与测试临时目录
        run: |
          printf 'TMPDIR=%s\nXMAKE_TMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: 准备私有中文消息 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales libssl-dev
          mkdir -p "$RUNNER_TEMP/echo-locale"
          localedef --no-archive -i zh_CN -f UTF-8 "$RUNNER_TEMP/echo-locale/zh_CN.UTF-8"
          echo "LOCPATH=$RUNNER_TEMP/echo-locale" >> "$GITHUB_ENV"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 构建全部目标并测试 release 模式
        run: |
          xmake f -c -y -m release --toolchain=clang --crc32c_portable=n
          python3 scripts/check_compile_commands.py --output-dir build/compdb/clang-release --mode release --toolchain clang --crc32c-portable n --arch x86_64
          xmake build --all -v
          xmake test -v -j1
      - name: 保留 Clang 编译数据库与配置身份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-database-clang
          path: build/compdb/
          if-no-files-found: ignore
          retention-days: 7

  static-analysis-clang:
    name: static-analysis (clang-14)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: 设置构建与测试临时目录
        run: |
          printf 'TMPDIR=%s\nXMAKE_TMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 固定 Clang 静态分析工具版本
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-14 libssl-dev
          clang-tidy-14 --version
      - name: 验证 Clang 自动清理执行与分析器模型差异
        run: |
          python3 scripts/probe_clang_cleanup_analyzer.py \
            --clang clang-14 --major 14 \
            --report-dir build/static-analysis/clang-14
      - name: 验证静态分析驱动器的失败与覆盖判定
        run: python3 scripts/test_static_analysis.py -v
      - name: 按真实生产编译命令执行静态分析并记录告警
        run: |
          set -euo pipefail
          xmake f -c -y -m release --toolchain=clang --crc32c_portable=n
          python3 scripts/check_compile_commands.py \
            --output-dir build/compdb/clang-release \
            --mode release --toolchain clang --crc32c-portable n --arch x86_64
          python3 scripts/run_static_analysis.py \
            --database-dir build/compdb/clang-release \
            --report-dir build/static-analysis/clang-14 \
            --mode release --toolchain clang --crc32c-portable n --arch x86_64 \
            --analyzer clang-tidy-14 --expected-major 14
      - name: 核对完整告警位置并阻断新增或漂移的诊断
        run: |
          python3 scripts/test_static_analysis_baseline.py -v
          python3 scripts/check_static_analysis_baseline.py \
            --report-dir build/static-analysis/clang-14 \
            --baseline docs/static_analysis_known_warnings.json
      - name: 保留分析诊断与数据库身份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-clang-14
          path: |
            build/static-analysis/clang-14/
            build/compdb/clang-release/
          if-no-files-found: ignore
          retention-days: 7

  static-analysis-gcc:
    name: static-analysis (gcc-11)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: 设置构建与测试临时目录
        run: |
          printf 'TMPDIR=%s\nXMAKE_TMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 安装 OpenSSL 3 开发文件
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 验证固定 GCC 版本及分析执行器失败语义
        run: |
          gcc --version
          python3 scripts/test_gcc_analyzer.py -v
          python3 scripts/test_gcc_analyzer_baseline.py -v
      - name: 使用真实 Xmake 生产命令编译并运行 GCC 静态分析
        run: |
          set -euo pipefail
          xmake f -c -y -m release --toolchain=gcc --crc32c_portable=n
          python3 scripts/check_compile_commands.py \
            --output-dir build/compdb/gcc-release \
            --mode release --toolchain gcc --crc32c-portable n --arch x86_64
          python3 scripts/run_gcc_analyzer.py \
            --database-dir build/compdb/gcc-release \
            --report-dir build/gcc-static-analysis/release \
            --baseline docs/gcc_analyzer_known_warnings.json \
            --expected-major 11 --timeout 150
      - name: 归档独立分析日志与实际编译配置
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-gcc-11
          path: |
            build/gcc-static-analysis/release/summary.json
            build/gcc-static-analysis/release/warning-gate.json
            build/gcc-static-analysis/release/logs/
            build/gcc-static-analysis/release/controls/
            build/compdb/gcc-release/
          if-no-files-found: ignore
          retention-days: 7

  asan-ubsan:
    name: ASan + UBSan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 设置构建与测试临时目录
        run: |
          printf 'TMPDIR=%s\nXMAKE_TMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: 准备私有中文消息 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales libssl-dev
          mkdir -p "$RUNNER_TEMP/echo-locale"
          localedef --no-archive -i zh_CN -f UTF-8 "$RUNNER_TEMP/echo-locale/zh_CN.UTF-8"
          echo "LOCPATH=$RUNNER_TEMP/echo-locale" >> "$GITHUB_ENV"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 构建全部目标并运行测试
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/asan-ubsan.log"
          exec 3>&1
          trap 'status=$?; tail -n 120 "$log_file" >&3; exit "$status"' EXIT
          exec >"$log_file" 2>&1
          git rev-parse HEAD
          xmake f -c -y -m asan --toolchain=gcc --crc32c_portable=n
          xmake build --all -v
          xmake test -v -j1
      - name: 归档运行时检查失败时的源码
        if: failure()
        run: git archive --format=tar -o "$RUNNER_TEMP/sanitizer-source.tar" HEAD
      - name: 保留运行时检查诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-ubsan-logs
          path: |
            ${{ runner.temp }}/asan-ubsan.log
            ${{ runner.temp }}/sanitizer-source.tar
          if-no-files-found: ignore
          retention-days: 7

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 设置构建与测试临时目录
        run: |
          printf 'TMPDIR=%s\nXMAKE_TMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: 准备私有中文消息 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales libssl-dev
          mkdir -p "$RUNNER_TEMP/echo-locale"
          localedef --no-archive -i zh_CN -f UTF-8 "$RUNNER_TEMP/echo-locale/zh_CN.UTF-8"
          echo "LOCPATH=$RUNNER_TEMP/echo-locale" >> "$GITHUB_ENV"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 构建全部目标并运行测试
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/tsan.log"
          exec 3>&1
          trap 'status=$?; tail -n 120 "$log_file" >&3; exit "$status"' EXIT
          exec >"$log_file" 2>&1
          git rev-parse HEAD
          xmake f -c -y -m tsan --toolchain=gcc --crc32c_portable=n
          xmake build --all -v
          xmake test -v -j1
      - name: 归档运行时检查失败时的源码
        if: failure()
        run: git archive --format=tar -o "$RUNNER_TEMP/sanitizer-source.tar" HEAD
      - name: 保留运行时检查诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-logs
          path: |
            ${{ runner.temp }}/tsan.log
            ${{ runner.temp }}/sanitizer-source.tar
          if-no-files-found: ignore
          retention-days: 7

  build-smoke:
    name: Make compatibility + install
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 设置构建与测试临时目录
        run: |
          printf 'TMPDIR=%s\nXMAKE_TMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: 准备私有中文消息 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales libssl-dev
          mkdir -p "$RUNNER_TEMP/echo-locale"
          localedef --no-archive -i zh_CN -f UTF-8 "$RUNNER_TEMP/echo-locale/zh_CN.UTF-8"
          echo "LOCPATH=$RUNNER_TEMP/echo-locale" >> "$GITHUB_ENV"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 验证项目格式配置
        run: |
          python3 -m pip install 'clang-format==18.1.8'
          clang-format --style=file --dump-config > /dev/null
          clang-format --dry-run --Werror include/tr/status.h src/status.c
      - name: 验证兼容入口与编译器切换
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/make-compat.log"
          exec 3>&1
          trap 'status=$?; tail -n 40 "$log_file" | cut -c1-1000 >&3; exit "$status"' EXIT
          exec >"$log_file" 2>&1
          make all CC=gcc
          make test CC=gcc
          make test-timer CC=gcc
          make clean
          make all CC=clang MODE=debug
      - name: 验证带引号的参数、工具路径与 ORIGIN 字面值
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/quoted-build.log"
          exec 3>&1
          trap 'status=$?; tail -n 60 "$log_file" | cut -c1-1000 >&3; exit "$status"' EXIT
          exec >"$log_file" 2>&1
          xmake f -c -y -m release --toolchain=gcc
          probe_dir="$RUNNER_TEMP/flags probe's directory"
          mkdir -p "$probe_dir"
          probe_header="$probe_dir/config.h"
          cat > "$probe_header" <<'C'
          #ifndef TR_BUILD_LABEL
          #error "CPPFLAGS was not forwarded"
          #endif
          _Static_assert(sizeof(TR_BUILD_LABEL) == sizeof("two words"),
                         "quoted CPPFLAGS was split");
          C
          # Also exercise XMAKE as an executable path containing spaces/quotes.
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$(command -v xmake)" > "$probe_dir/xmake"
          chmod +x "$probe_dir/xmake"
          make all CC=gcc XMAKE="$probe_dir/xmake" \
            CPPFLAGS="-DTR_BUILD_LABEL='\"two words\"'" \
            CFLAGS="-include \"$probe_header\"" \
            LDFLAGS='-Wl,-rpath,$$ORIGIN/compat-sdk'
          readelf -d build/linux/x86_64/release/test_transport | grep -F '$ORIGIN/compat-sdk'
      - name: 安装并验证 SDK 头文件边界，运行公共门面消费端
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/sdk-install.log"
          exec 3>&1
          trap 'status=$?; tail -n 80 "$log_file" | cut -c1-1000 >&3; exit "$status"' EXIT
          exec >"$log_file" 2>&1
          xmake f -c -y -m release --toolchain=gcc
          xmake build trcore
          prefix="$RUNNER_TEMP/trpc sdk"
          xmake install -o "$prefix" trcore

          # 许可文本随已安装 SDK 和源码归档分发，内容不得丢失或变化。
          for legal_file in LICENSE NOTICE; do
            cmp "$legal_file" "$prefix/share/doc/c-trpc/$legal_file"
          done
          cmp docs/licensing.md "$prefix/share/doc/c-trpc/licensing.md"
          cmp third_party/zstd/LICENSE "$prefix/share/doc/c-trpc/third_party/zstd/LICENSE"
          # 原外部链接方式不额外传 -lzstd；符号必须来自安装的静态 SDK。
          nm --defined-only "$prefix/lib/libtrcore.a" > "$RUNNER_TEMP/sdk-symbols.txt"
          test "$(awk '$NF == "ZSTD_versionNumber" { n++ } END { print n+0 }' "$RUNNER_TEMP/sdk-symbols.txt")" = 1
          archive_dir="$RUNNER_TEMP/trpc-source-license"
          mkdir -p "$archive_dir"
          git archive --format=tar HEAD | tar -xf - -C "$archive_dir"
          cmp LICENSE "$archive_dir/LICENSE"
          cmp NOTICE "$archive_dir/NOTICE"
          cmp docs/licensing.md "$archive_dir/docs/licensing.md"
          cmp third_party/zstd/LICENSE "$archive_dir/third_party/zstd/LICENSE"

          cat > "$RUNNER_TEMP/expected-headers.txt" <<'EOF'
          client.h
          facade.h
          peer_identity.h
          rpc.h
          rpc_codec.h
          rpc_v2.h
          server.h
          status.h
          tls.h
          transport.h
          trpc.h
          EOF
          find "$prefix/include/tr" -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/installed-headers.txt"
          diff -u "$RUNNER_TEMP/expected-headers.txt" "$RUNNER_TEMP/installed-headers.txt"

          # These implementation headers used to be published only because
          # xmake installed include/tr/*.h with a glob. Keep them private.
          for private_header in             command_queue.h cleanup.h crc32c.h endian.h guard.h observability.h parser.h refcount.h             rpc_wire.h socket.h; do
            test ! -e "$prefix/include/tr/$private_header"
          done

          cat > "$RUNNER_TEMP/consumer.c" <<'C'
          #include <tr/trpc.h>
          #include <string.h>

          int main(void)
          {
              struct tr_client_config client_config;
              struct tr_server_config server_config;

              tr_client_config_init(&client_config);
              tr_server_config_init(&server_config);

              if (client_config.limits.max_calls == 0U ||
                  server_config.limits.max_calls == 0U ||
                  client_config.connection_groups.max_data_connections != 0U ||
                  server_config.connection_groups.max_groups != 0U ||
                  client_config.tls.mode != TR_TLS_DISABLED ||
                  server_config.tls.mode != TR_TLS_DISABLED)
                  return 1;
              return strcmp(tr_status_str(TR_OK), "ok") != 0;
          }
          C

          for cc in gcc clang; do
            for header in "$prefix"/include/tr/*.h; do
              printf '#include <tr/%s>\n' "$(basename "$header")" |                 "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -pthread                 -I"$prefix/include" -x c -fsyntax-only -
            done
            "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -pthread               -I"$prefix/include" "$RUNNER_TEMP/consumer.c"               -L"$prefix/lib" -ltrcore -lssl -lcrypto -o "$RUNNER_TEMP/consumer-$cc"
            timeout 10s "$RUNNER_TEMP/consumer-$cc"
            echo "$cc: explicit SDK headers and public facade consumer passed"
          done
          # 还需验证 C linkage：仅语法检查无法发现符号改名。
          for cxx in g++ clang++; do
            for header in "$prefix"/include/tr/*.h; do
              printf '#include <tr/%s>\n' "$(basename "$header")" | \
                "$cxx" -std=c++11 -Wall -Wextra -Werror -pedantic -pthread \
                -I"$prefix/include" -x c++ -fsyntax-only -
            done
            "$cxx" -std=c++11 -Wall -Wextra -Werror -pedantic -pthread \
              -I"$prefix/include" -x c++ "$RUNNER_TEMP/consumer.c" -x none \
              -L"$prefix/lib" -ltrcore -lssl -lcrypto -o "$RUNNER_TEMP/consumer-$cxx"
            timeout 10s "$RUNNER_TEMP/consumer-$cxx"
            echo "$cxx: explicit SDK headers and public facade consumer passed"
          done

          # 公共 V2 的真实两端从仓库外编译；不能由源码相对路径或包缓存
          # 补齐未安装头文件、内部符号或第三方静态依赖。
          consumer_dir="$RUNNER_TEMP/v2 sdk consumer"
          mkdir -p "$consumer_dir"
          cp tests/test_rpc_v2_sdk.c "$consumer_dir/consumer.c"
          for consumer_compiler in gcc clang g++ clang++; do
            case "$consumer_compiler" in
              gcc|clang) language=(-std=c11 -x c) ;;
              *) language=(-std=c++11 -x c++) ;;
            esac
            (
              cd "$consumer_dir"
              "$consumer_compiler" "${language[@]}" \
                -Wall -Wextra -Werror -pedantic -pthread \
                -I"$prefix/include" consumer.c \
                -L"$prefix/lib" -ltrcore -lssl -lcrypto -o "consumer-$consumer_compiler"
              timeout 30s "./consumer-$consumer_compiler"
            )
            printf 'sdk-v2: compiler=%s result=pass\n' "$consumer_compiler"
          done
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: 验证 Echo 停止判定不会漏报失败
        run: python3 scripts/test_echo_smoke_shutdown.py
      - name: 以独立进程运行 Echo 示例
        run: |
          set -euo pipefail
          xmake build echo_server
          xmake build echo_client
          server_log="$RUNNER_TEMP/echo-server.log"
          stdbuf -oL build/linux/x86_64/release/echo_server 0 >"$server_log" 2>&1 &
          server_pid=$!
          # 失败路径只负责清理；正常停止必须单独检查退出状态。
          trap 'kill -KILL "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          port=
          for attempt in $(seq 1 100); do
            port=$(sed -n 's/^echo server listening on 0\.0\.0\.0:\([0-9][0-9]*\)$/\1/p' "$server_log")
            if [ -n "$port" ]; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$server_log"; exit 1; fi
            sleep 0.1
          done
          if [ -z "$port" ]; then cat "$server_log"; exit 1; fi
          timeout 20s xmake run echo_client 127.0.0.1 "$port" xmake-smoke | tee "$RUNNER_TEMP/echo-client.log"
          grep -Fx 'response: xmake-smoke' "$RUNNER_TEMP/echo-client.log"
          source scripts/echo_smoke_shutdown.sh
          echo_smoke_shutdown "$server_pid" "$server_log" 10s
          trap - EXIT
      - name: 保留冒烟测试诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-smoke-logs
          path: |
            ${{ runner.temp }}/make-compat.log
            ${{ runner.temp }}/quoted-build.log
            ${{ runner.temp }}/sdk-install.log
            ${{ runner.temp }}/echo-client.log
            ${{ runner.temp }}/echo-server.log
          if-no-files-found: ignore
          retention-days: 7

  crc32c-cpu-fallback:
    name: CRC32C without SSE4.2
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 设置构建与测试临时目录
        run: |
          printf 'TMPDIR=%s\nXMAKE_TMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 安装 TLS 与用户态 CPU 模拟器依赖
        run: sudo apt-get update && sudo apt-get install -y libssl-dev qemu-user
      - name: 运行强制可移植后端
        run: |
          xmake f -c -y -m release --toolchain=gcc --crc32c_portable=y
          python3 scripts/check_compile_commands.py --output-dir build/compdb/gcc-portable --mode release --toolchain gcc --crc32c-portable y --arch x86_64
          xmake build test_crc32c
          xmake run test_crc32c --expect-portable
      - name: 隐藏 SSE4.2 后运行自动分派
        run: |
          xmake f -c -y -m release --toolchain=gcc --crc32c_portable=n
          xmake build test_crc32c
          qemu-x86_64 -cpu max,-sse4.2 build/linux/x86_64/release/test_crc32c --expect-portable
