name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "refactor/**"
  pull_request:

permissions:
  contents: read

env:
  XMAKE_VERSION: '3.1.1'

jobs:
  build-test-gcc:
    name: build-test (gcc)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 准备私有中文消息 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          mkdir -p "$RUNNER_TEMP/echo-locale"
          localedef --no-archive -i zh_CN -f UTF-8 "$RUNNER_TEMP/echo-locale/zh_CN.UTF-8"
          echo "LOCPATH=$RUNNER_TEMP/echo-locale" >> "$GITHUB_ENV"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 校验 Echo 翻译目录
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          python3 scripts/compile_echo_catalog.py --check
      - name: 构建全部目标并测试 debug 与 release 模式
        run: |
          for mode in debug release; do
            xmake f -c -y -m "$mode" --toolchain=gcc --crc32c_portable=n
            xmake build --all -v
            xmake test -v -j1
          done

  build-test-clang:
    name: build-test (clang)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 准备私有中文消息 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          mkdir -p "$RUNNER_TEMP/echo-locale"
          localedef --no-archive -i zh_CN -f UTF-8 "$RUNNER_TEMP/echo-locale/zh_CN.UTF-8"
          echo "LOCPATH=$RUNNER_TEMP/echo-locale" >> "$GITHUB_ENV"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 构建全部目标并测试 release 模式
        run: |
          xmake f -c -y -m release --toolchain=clang --crc32c_portable=n
          xmake build --all -v
          xmake test -v -j1

  asan-ubsan:
    name: ASan + UBSan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 准备私有中文消息 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          mkdir -p "$RUNNER_TEMP/echo-locale"
          localedef --no-archive -i zh_CN -f UTF-8 "$RUNNER_TEMP/echo-locale/zh_CN.UTF-8"
          echo "LOCPATH=$RUNNER_TEMP/echo-locale" >> "$GITHUB_ENV"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 构建全部目标并运行测试
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/asan-ubsan.log"
          exec 3>&1
          trap 'status=$?; tail -n 120 "$log_file" >&3; exit "$status"' EXIT
          exec >"$log_file" 2>&1
          git rev-parse HEAD
          xmake f -c -y -m asan --toolchain=gcc --crc32c_portable=n
          xmake build --all -v
          xmake test -v -j1
      - name: 归档运行时检查失败时的源码
        if: failure()
        run: git archive --format=tar -o "$RUNNER_TEMP/sanitizer-source.tar" HEAD
      - name: 保留运行时检查诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-ubsan-logs
          path: |
            ${{ runner.temp }}/asan-ubsan.log
            ${{ runner.temp }}/sanitizer-source.tar
          if-no-files-found: ignore
          retention-days: 7

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 准备私有中文消息 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          mkdir -p "$RUNNER_TEMP/echo-locale"
          localedef --no-archive -i zh_CN -f UTF-8 "$RUNNER_TEMP/echo-locale/zh_CN.UTF-8"
          echo "LOCPATH=$RUNNER_TEMP/echo-locale" >> "$GITHUB_ENV"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 构建全部目标并运行测试
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/tsan.log"
          exec 3>&1
          trap 'status=$?; tail -n 120 "$log_file" >&3; exit "$status"' EXIT
          exec >"$log_file" 2>&1
          git rev-parse HEAD
          xmake f -c -y -m tsan --toolchain=gcc --crc32c_portable=n
          xmake build --all -v
          xmake test -v -j1
      - name: 归档运行时检查失败时的源码
        if: failure()
        run: git archive --format=tar -o "$RUNNER_TEMP/sanitizer-source.tar" HEAD
      - name: 保留运行时检查诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-logs
          path: |
            ${{ runner.temp }}/tsan.log
            ${{ runner.temp }}/sanitizer-source.tar
          if-no-files-found: ignore
          retention-days: 7

  build-smoke:
    name: Make compatibility + install
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 准备私有中文消息 locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          mkdir -p "$RUNNER_TEMP/echo-locale"
          localedef --no-archive -i zh_CN -f UTF-8 "$RUNNER_TEMP/echo-locale/zh_CN.UTF-8"
          echo "LOCPATH=$RUNNER_TEMP/echo-locale" >> "$GITHUB_ENV"
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 验证项目格式配置
        run: |
          python3 -m pip install 'clang-format==18.1.8'
          clang-format --style=file --dump-config > /dev/null
          clang-format --dry-run --Werror include/tr/status.h src/status.c
      - name: 验证兼容入口与编译器切换
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/make-compat.log"
          exec 3>&1
          trap 'status=$?; tail -n 40 "$log_file" | cut -c1-1000 >&3; exit "$status"' EXIT
          exec >"$log_file" 2>&1
          make all CC=gcc
          make test CC=gcc
          make test-timer CC=gcc
          make clean
          make all CC=clang MODE=debug
      - name: 验证带引号的参数、工具路径与 ORIGIN 字面值
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/quoted-build.log"
          exec 3>&1
          trap 'status=$?; tail -n 60 "$log_file" | cut -c1-1000 >&3; exit "$status"' EXIT
          exec >"$log_file" 2>&1
          xmake f -c -y -m release --toolchain=gcc
          probe_dir="$RUNNER_TEMP/flags probe's directory"
          mkdir -p "$probe_dir"
          probe_header="$probe_dir/config.h"
          cat > "$probe_header" <<'C'
          #ifndef TR_BUILD_LABEL
          #error "CPPFLAGS was not forwarded"
          #endif
          _Static_assert(sizeof(TR_BUILD_LABEL) == sizeof("two words"),
                         "quoted CPPFLAGS was split");
          C
          # Also exercise XMAKE as an executable path containing spaces/quotes.
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$(command -v xmake)" > "$probe_dir/xmake"
          chmod +x "$probe_dir/xmake"
          make all CC=gcc XMAKE="$probe_dir/xmake" \
            CPPFLAGS="-DTR_BUILD_LABEL='\"two words\"'" \
            CFLAGS="-include \"$probe_header\"" \
            LDFLAGS='-Wl,-rpath,$$ORIGIN/compat-sdk'
          readelf -d build/linux/x86_64/release/test_transport | grep -F '$ORIGIN/compat-sdk'
      - name: 安装并验证 SDK 头文件边界，运行公共门面消费端
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/sdk-install.log"
          exec 3>&1
          trap 'status=$?; tail -n 80 "$log_file" | cut -c1-1000 >&3; exit "$status"' EXIT
          exec >"$log_file" 2>&1
          xmake f -c -y -m release --toolchain=gcc
          xmake build trcore
          prefix="$RUNNER_TEMP/trpc sdk"
          xmake install -o "$prefix" trcore

          # 许可文本随已安装 SDK 和源码归档分发，内容不得丢失或变化。
          for legal_file in LICENSE NOTICE; do
            cmp "$legal_file" "$prefix/share/doc/c-trpc/$legal_file"
          done
          cmp docs/licensing.md "$prefix/share/doc/c-trpc/licensing.md"
          archive_dir="$RUNNER_TEMP/trpc-source-license"
          mkdir -p "$archive_dir"
          git archive --format=tar HEAD | tar -xf - -C "$archive_dir"
          cmp LICENSE "$archive_dir/LICENSE"
          cmp NOTICE "$archive_dir/NOTICE"
          cmp docs/licensing.md "$archive_dir/docs/licensing.md"

          cat > "$RUNNER_TEMP/expected-headers.txt" <<'EOF'
          client.h
          facade.h
          rpc.h
          rpc_codec.h
          server.h
          status.h
          transport.h
          trpc.h
          EOF
          find "$prefix/include/tr" -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/installed-headers.txt"
          diff -u "$RUNNER_TEMP/expected-headers.txt" "$RUNNER_TEMP/installed-headers.txt"

          # These implementation headers used to be published only because
          # xmake installed include/tr/*.h with a glob. Keep them private.
          for private_header in             command_queue.h cleanup.h crc32c.h endian.h guard.h observability.h parser.h refcount.h             rpc_wire.h socket.h; do
            test ! -e "$prefix/include/tr/$private_header"
          done

          cat > "$RUNNER_TEMP/consumer.c" <<'C'
          #include <tr/trpc.h>
          #include <string.h>

          int main(void)
          {
              struct tr_client_config client_config;
              struct tr_server_config server_config;

              tr_client_config_init(&client_config);
              tr_server_config_init(&server_config);

              if (client_config.limits.max_calls == 0U ||
                  server_config.limits.max_calls == 0U ||
                  client_config.connection_groups.max_data_connections != 0U ||
                  server_config.connection_groups.max_groups != 0U)
                  return 1;
              return strcmp(tr_status_str(TR_OK), "ok") != 0;
          }
          C

          for cc in gcc clang; do
            for header in "$prefix"/include/tr/*.h; do
              printf '#include <tr/%s>\n' "$(basename "$header")" |                 "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -pthread                 -I"$prefix/include" -x c -fsyntax-only -
            done
            "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -pthread               -I"$prefix/include" "$RUNNER_TEMP/consumer.c"               -L"$prefix/lib" -ltrcore -o "$RUNNER_TEMP/consumer-$cc"
            timeout 10s "$RUNNER_TEMP/consumer-$cc"
            echo "$cc: explicit SDK headers and public facade consumer passed"
          done
          # 还需验证 C linkage：仅语法检查无法发现符号改名。
          for cxx in g++ clang++; do
            for header in "$prefix"/include/tr/*.h; do
              printf '#include <tr/%s>\n' "$(basename "$header")" | \
                "$cxx" -std=c++11 -Wall -Wextra -Werror -pedantic -pthread \
                -I"$prefix/include" -x c++ -fsyntax-only -
            done
            "$cxx" -std=c++11 -Wall -Wextra -Werror -pedantic -pthread \
              -I"$prefix/include" -x c++ "$RUNNER_TEMP/consumer.c" -x none \
              -L"$prefix/lib" -ltrcore -o "$RUNNER_TEMP/consumer-$cxx"
            timeout 10s "$RUNNER_TEMP/consumer-$cxx"
            echo "$cxx: explicit SDK headers and public facade consumer passed"
          done
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: 验证 Echo 停止判定不会漏报失败
        run: python3 scripts/test_echo_smoke_shutdown.py
      - name: 以独立进程运行 Echo 示例
        run: |
          set -euo pipefail
          xmake build echo_server
          xmake build echo_client
          server_log="$RUNNER_TEMP/echo-server.log"
          stdbuf -oL build/linux/x86_64/release/echo_server 0 >"$server_log" 2>&1 &
          server_pid=$!
          # 失败路径只负责清理；正常停止必须单独检查退出状态。
          trap 'kill -KILL "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          port=
          for attempt in $(seq 1 100); do
            port=$(sed -n 's/^echo server listening on 0\.0\.0\.0:\([0-9][0-9]*\)$/\1/p' "$server_log")
            if [ -n "$port" ]; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$server_log"; exit 1; fi
            sleep 0.1
          done
          if [ -z "$port" ]; then cat "$server_log"; exit 1; fi
          timeout 20s xmake run echo_client 127.0.0.1 "$port" xmake-smoke | tee "$RUNNER_TEMP/echo-client.log"
          grep -Fx 'response: xmake-smoke' "$RUNNER_TEMP/echo-client.log"
          source scripts/echo_smoke_shutdown.sh
          echo_smoke_shutdown "$server_pid" "$server_log" 10s
          trap - EXIT
      - name: 保留冒烟测试诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-smoke-logs
          path: |
            ${{ runner.temp }}/make-compat.log
            ${{ runner.temp }}/quoted-build.log
            ${{ runner.temp }}/sdk-install.log
            ${{ runner.temp }}/echo-client.log
            ${{ runner.temp }}/echo-server.log
          if-no-files-found: ignore
          retention-days: 7

  crc32c-cpu-fallback:
    name: CRC32C without SSE4.2
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 安装用户态 CPU 模拟器
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: 运行强制可移植后端
        run: |
          xmake f -c -y -m release --toolchain=gcc --crc32c_portable=y
          xmake build test_crc32c
          xmake run test_crc32c --expect-portable
      - name: 隐藏 SSE4.2 后运行自动分派
        run: |
          xmake f -c -y -m release --toolchain=gcc --crc32c_portable=n
          xmake build test_crc32c
          qemu-x86_64 -cpu max,-sse4.2 build/linux/x86_64/release/test_crc32c --expect-portable
